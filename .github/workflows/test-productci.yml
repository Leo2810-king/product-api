name: Test Product CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn từ GitHub về Runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Node.js
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Cài đặt các thư viện phụ thuộc
      - name: Install Dependencies
        run: npm install

      # 4. Kiểm tra mã nguồn & Chạy test thử nghiệm
      - name: Run Test Trial
        run: |
          echo "==== STARTING CI TEST RUN ===="
          node -v
          npm -v
          echo "CI Pipeline test successfully completed!"