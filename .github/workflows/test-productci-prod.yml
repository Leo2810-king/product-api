name: Production CI Pipeline - Product API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    name: Run CRUD & MongoDB Integration Tests
    runs-on: ubuntu-latest

    # Khởi chạy service MongoDB container trực tiếp trên máy ảo GitHub
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout mã nguồn dự án
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Node.js 18
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Cài đặt các dependencies (sử dụng npm ci để tối ưu tốc độ và tính đồng nhất)
      - name: Install Dependencies
        run: npm ci

      # 4. Kiểm tra cú pháp mã nguồn (Linting / Syntax Check)
      - name: Check Code Syntax
        run: node --check server.js

      # 5. Khởi chạy thử nghiệm Server & Kiểm tra kết nối MongoDB
      - name: Test Server & MongoDB Connection
        env:
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/product_db_test
        run: |
          echo "==== STARTING PRODUCTION CI TESTING ===="
          # Chạy server ở chế độ ngầm
          node server.js &
          SERVER_PID=$!
          
          # Đợi 5 giây để server và MongoDB thiết lập kết nối
          sleep 5
          
          # Kiểm tra healthcheck endpoint API
          curl -f http://localhost:3000/api/products || exit 1
          
          echo "==== API & MONGODB INTEGRATION TEST PASSED ===="
          kill $SERVER_PID

      # 6. Build thử nghiệm Docker Image sản phẩm
      - name: Build Docker Image
        run: |
          docker build -t product-api:prod .
          docker images